
version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - mkdir -p /tmp/go-cache /tmp/go-home
      - export GOCACHE=/tmp/go-cache
      - export HOME=/tmp/go-home
      - export GOPATH=/tmp/go-home/go
      - export PATH=$PATH:$GOPATH/bin

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/order-management-microservices"
      - echo "=== Go version in CodeBuild ==="
      - go version
      - go mod download
      - echo "=== Running Order service tests ==="
      - go test -v ./... 2>&1 || (echo "ORDER SERVICE TESTS FAILED"; exit 1)
      - echo "=== Running Product service tests ==="
      - cd product-service
      - go mod download
      - go test -v ./... 2>&1 || (echo "PRODUCT SERVICE TESTS FAILED"; exit 1)

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/order-management-microservices"
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/order-service .
      - cd product-service
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../dist/product-service .
      - cd ..
      - cp database/migrations/001_create_orders_table.sql dist/

  post_build:
    commands:
      - echo "Go services built successfully"

artifacts:
  files:
    - order-service
    - product-service
    - 001_create_orders_table.sql
  base-directory: order-management-microservices/dist
  discard-paths: yes
